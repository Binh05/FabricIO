<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Fab_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>FabricIO - Free Online Games, Browser Games & Indie Game Community</title>

    <meta
      name="description"
      content="Discover and play free online games, indie games and browser games on FabricIO. No downloads or installation required. Upload, share your own games, play together and discuss with the gaming community. Khám phá, chơi và chia sẻ game miễn phí ngay trên trình duyệt!"
    />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://fabricio.id.vn/" />

    <!-- Language & International SEO -->
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="FabricIO" />
    <meta
      property="og:title"
      content="FabricIO - Discover, Play & Share Indie Games Online"
    />
    <meta
      property="og:description"
      content="Your indie game community. Discover free browser games, play online without downloads, upload and share your games, and connect with other gamers."
    />
    <meta property="og:url" content="https://fabricio.id.vn/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fabricio.id.vn/og-image.png" />
    <meta property="og:image:width" content="1648" />
    <meta property="og:image:height" content="928" />
    <meta property="og:image:alt" content="FabricIO - Discover. Play. Share." />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="FabricIO - Discover, Play & Share Indie Games Online"
    />
    <meta
      name="twitter:description"
      content="Play free browser games without downloads. Upload, share and discuss indie games with the community."
    />
    <meta name="twitter:image" content="https://fabricio.id.vn/og-image.png" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FabricIO",
      "alternateName": [
        "FabricIO Game",
        "FabricIO Indie Game Community"
      ],
      "url": "https://fabricio.id.vn/",
      "description": "A community platform to discover, play, upload, share and discuss indie games and browser games online without downloads or installation.",
      "inLanguage": ["vi", "en"],
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://fabricio.id.vn/search?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
