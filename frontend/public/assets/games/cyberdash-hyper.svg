<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#051c2f"/>
      <stop offset="100%" stop-color="#020a12"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#cyberBg)"/>
  <!-- Perspective speed road -->
  <polygon points="90,60 110,60 170,200 30,200" fill="#09253d"/>
  <line x1="100" y1="60" x2="100" y2="200" stroke="#00f5d4" stroke-width="2" stroke-dasharray="10 14"/>
  <!-- Light streaks -->
  <line x1="20" y1="40" x2="80" y2="180" stroke="#00c9b0" stroke-opacity="0.3" stroke-width="1.5"/>
  <line x1="180" y1="30" x2="120" y2="180" stroke="#00f5d4" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="160" y1="20" x2="140" y2="140" stroke="#ff4655" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Cyber runner character silhouette & trail -->
  <polygon points="100,105 112,125 88,125" fill="#00f5d4"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff"/>
  <rect x="94" y="125" width="12" height="15" fill="#00f5d4" opacity="0.8"/>
  <circle cx="100" cy="115" r="18" fill="none" stroke="#00f5d4" stroke-opacity="0.3" stroke-width="1"/>
</svg>