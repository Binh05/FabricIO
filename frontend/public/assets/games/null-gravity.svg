<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <rect width="200" height="200" fill="#08080a"/>
  <!-- Gravitational rings and floating wireframes -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="100" cy="100" r="45" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Floating Monolith / Physics Crate -->
  <polygon points="90,50 130,65 95,80 55,65" fill="#2a2a30" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <polygon points="55,65 95,80 95,120 55,105" fill="#16161a" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <polygon points="130,65 95,80 95,120 130,105" fill="#3a3a42" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1"/>
  <!-- Scattered floating particles -->
  <rect x="145" y="130" width="15" height="15" fill="#ffffff" opacity="0.6" transform="rotate(25 152 137)"/>
  <rect x="40" y="135" width="10" height="10" fill="#ffffff" opacity="0.4" transform="rotate(45 45 140)"/>
  <circle cx="100" cy="140" r="2.5" fill="#ffffff"/>
  <circle cx="120" cy="40" r="2" fill="#ffffff"/>
</svg>