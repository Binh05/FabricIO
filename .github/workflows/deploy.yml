name: CI/CD Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
              - '!backend/src/test/**'
              - '!backend/*.md'

  Lint-test:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

  Backend-Test:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run Tests
        run: ./gradlew test

  Build-And-Push-Fe-Image:
    runs-on: ubuntu-latest
    needs: [ changes, Lint-test ]

    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.frontend == 'true' &&
      needs.Lint-test.result == 'success'

    steps:
      - name: Checkout source code fe
        uses: actions/checkout@v4

      - name: Docker metadata (Frontend)
        id: meta-fe
        uses: docker/metadata-action@v5
        with:
          images: bin05/fab-fe
          tags: |
            type=semver,pattern={{version}},value={{raw}},prefix=v
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta-fe.outputs.tags }}
          build-args: REACT_API_URL=${{ secrets.REACT_API_URL }}
          labels: ${{ steps.meta-fe.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  Build-And-Push-Be-Image:
    runs-on: ubuntu-latest
    needs: [ changes, Backend-Test ]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.backend == 'true' &&
      needs.Backend-Test.result == 'success'

    steps:
      - name: Check source code be
        uses: actions/checkout@v4

      - name: Docker metadata (Backend)
        id: meta-be
        uses: docker/metadata-action@v5
        with:
          images: bin05/fab-be
          tags: |
            type=semver,pattern={{version}},value={{raw}},prefix=v
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-be.outputs.tags }}
          labels: ${{ steps.meta-be.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [changes, Build-And-Push-Fe-Image, Build-And-Push-Be-Image]
    if: |
      github.event_name == 'workflow_dispatch' &&
      (needs.Build-And-Push-Fe-Image.result == 'success' || needs.Build-And-Push-Fe-Image.result == 'skipped') &&
      (needs.Build-And-Push-Be-Image.result == 'success' || needs.Build-And-Push-Be-Image.result == 'skipped')
    steps:
      - name: Deploy
        run: |
          cd /home/ubuntu/app
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            FINAL_VERSION="${GITHUB_REF_NAME#v}"
          else
            FINAL_VERSION="latest"
          fi
          echo "Deploying version: $FINAL_VERSION"
          sed -i '/^APP_VERSION=/d' .env
          echo "APP_VERSION=$FINAL_VERSION" >> .env
          docker pull bin05/fab-fe:$FINAL_VERSION
          docker pull bin05/fab-be:$FINAL_VERSION
          docker compose up -d --force-recreate
          docker image prune -f
