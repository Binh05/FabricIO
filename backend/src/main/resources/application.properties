spring.application.name=backend

# Jwt
app.jwt.secret=${APP.JWT.SECRET}
app.jwt.expiration-ms=${APP.JWT.EXPIRATION_MS}

# DB
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
#spring.jpa.hibernate.ddl-auto=update
# đo benchmark
spring.jpa.hibernate.ddl-auto=update
# logging sql
logging.level.org.hibernate.SQL=DEBUG

springdoc.swagger-ui.with-credentials=true

# Minio
minio.url=${MINIO_URL}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket=${MINIO_BUCKET}
minio.domain=${MINIO_DOMAIN}

# AWS S3
aws.s3.url=${AWS_S3_URL}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}
aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}

spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# App Storage Configuration (MinIO / S3)
app.storage.endpoint=${MINIO_URL:http://localhost:9000}
app.storage.public-endpoint=${MINIO_DOMAIN:http://localhost:9000}
app.storage.bucket=${MINIO_BUCKET:fabricio-dev}
app.storage.access-key=${MINIO_ACCESS_KEY:minioadmin}
app.storage.secret-key=${MINIO_SECRET_KEY:minioadmin}
app.storage.region=${AWS_S3_REGION:us-east-1}
app.storage.path-style=true